// STAR BACKGROUND

function initStars() {
    const canvas = document.getElementById('star-bg');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const stars = [];
    for (let i = 0; i < 250; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 1.5 + 0.3,
            opacity: Math.random() * 0.7 + 0.1,
            speed: Math.random() * 0.002 + 0.001,
            phase: Math.random() * Math.PI * 2
        });
    }

    let frame = 0;
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        frame++;
        stars.forEach(s => {
            const twinkle = 0.5 + 0.5 * Math.sin(frame * s.speed + s.phase);
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(200, 220, 255, ${s.opacity * twinkle})`;
            ctx.fill();
        });
        requestAnimationFrame(draw);
    }
    draw();
}

    feBlurC.setAttribute('stdDeviation', '12');
    feBlurC.setAttribute('result', 'coloredBlur');
    const feMergeC = svgCreate('feMerge');
    ['coloredBlur', 'SourceGraphic'].forEach(inp => {
        const n = svgCreate('feMergeNode');
        n.setAttribute('in', inp);
        feMergeC.appendChild(n);
    });
    fCenter.appendChild(feBlurC);
    fCenter.appendChild(feMergeC);
    defs.appendChild(fCenter);

    // Node glow filter
    const fNode = svgCreate('filter');
    fNode.setAttribute('id', 'glow-node');
    fNode.setAttribute('x', '-60%'); fNode.setAttribute('y', '-60%');
    fNode.setAttribute('width', '220%'); fNode.setAttribute('height', '220%');
    const feBlurN = svgCreate('feGaussianBlur');
    feBlurN.setAttribute('stdDeviation', '8');
    feBlurN.setAttribute('result', 'coloredBlur');
    const feMergeN = svgCreate('feMerge');
    ['coloredBlur', 'SourceGraphic'].forEach(inp => {
        const n = svgCreate('feMergeNode');
        n.setAttribute('in', inp);
        feMergeN.appendChild(n);
    });
    fNode.appendChild(feBlurN);
    fNode.appendChild(feMergeN);
    defs.appendChild(fNode);

    svgEl.appendChild(defs);

    // Orbit ring
    const orbitRing = svgCreate('circle');
    orbitRing.setAttribute('cx', cx);
    orbitRing.setAttribute('cy', cy);
    orbitRing.setAttribute('r', 220);
    orbitRing.setAttribute('fill', 'none');
    orbitRing.setAttribute('stroke', 'rgba(255,255,255,0.04)');
    orbitRing.setAttribute('stroke-width', '1');
    orbitRing.setAttribute('stroke-dasharray', '4 8');
    svgEl.appendChild(orbitRing);

    // Connecting lines from center to each node
    EDUCATIONS.forEach(edu => {
        const { nx, ny } = nodePos(edu);
        const line = svgCreate('line');
        line.setAttribute('x1', cx);
        line.setAttribute('y1', cy);
        line.setAttribute('x2', nx);
        line.setAttribute('y2', ny);
        line.setAttribute('stroke', edu.color);
        line.setAttribute('stroke-width', '1');
        line.setAttribute('stroke-opacity', '0.25');
        line.setAttribute('stroke-dasharray', '5 5');
        line.classList.add('path-line');
        svgEl.appendChild(line);
    });

    // Education nodes
    EDUCATIONS.forEach(edu => {
        const g = svgCreate('g');
        g.setAttribute('class', 'edu-node');
        g.setAttribute('cursor', 'pointer');
        g.setAttribute('data-id', edu.id);

        const { nx, ny } = nodePos(edu);

        // Outer glow ring (hover effect)
        const ring = svgCreate('circle');
        ring.setAttribute('cx', nx);
        ring.setAttribute('cy', ny);
        ring.setAttribute('r', '38');
        ring.setAttribute('fill', 'none');
        ring.setAttribute('stroke', edu.glow);
        ring.setAttribute('stroke-width', '2');
        ring.setAttribute('opacity', '0');
        ring.setAttribute('class', 'hover-ring');
        ring.style.transition = 'opacity 0.3s ease, r 0.3s ease';
        g.appendChild(ring);

        // Node circle background
        const bg = svgCreate('circle');
        bg.setAttribute('cx', nx);
        bg.setAttribute('cy', ny);
        bg.setAttribute('r', '28');
        bg.setAttribute('fill', `rgba(${hexToRgb(edu.color)}, 0.15)`);
        bg.setAttribute('stroke', edu.color);
        bg.setAttribute('stroke-width', '2');
        bg.setAttribute('filter', 'url(#glow-node)');
        g.appendChild(bg);

        // Inner fill
        const inner = svgCreate('circle');
        inner.setAttribute('cx', nx);
        inner.setAttribute('cy', ny);
        inner.setAttribute('r', '20');
        inner.setAttribute('fill', `rgba(${hexToRgb(edu.color)}, 0.3)`);
        g.appendChild(inner);

        // Emoji as foreignObject
        const fo = svgCreate('foreignObject');
        fo.setAttribute('x', nx - 14);
        fo.setAttribute('y', ny - 16);
        fo.setAttribute('width', '28');
        fo.setAttribute('height', '28');
        fo.style.pointerEvents = 'none';
        const span = document.createElement('span');
        span.textContent = edu.emoji;
        span.style.cssText = 'font-size:18px;display:flex;align-items:center;justify-content:center;width:28px;height:28px;';
        fo.appendChild(span);
        g.appendChild(fo);

        // Label below node
        const label = svgCreate('text');
        const labelY = ny + (edu.angle > 120 && edu.angle < 240 ? -42 : 48);
        label.setAttribute('x', nx);
        label.setAttribute('y', labelY);
        label.setAttribute('text-anchor', 'middle');
        label.setAttribute('font-family', "'Orbitron', monospace");
        label.setAttribute('font-size', '11');
        label.setAttribute('font-weight', '700');
        label.setAttribute('fill', edu.color);
        label.setAttribute('letter-spacing', '0.08em');
        label.textContent = edu.shortName;
        g.appendChild(label);

        const subLabel = svgCreate('text');
        const subLabelY = edu.angle > 120 && edu.angle < 240 ? labelY - 14 : labelY + 14;
        subLabel.setAttribute('x', nx);
        subLabel.setAttribute('y', subLabelY);
        subLabel.setAttribute('text-anchor', 'middle');
        subLabel.setAttribute('font-family', "'Space Grotesk', sans-serif");
        subLabel.setAttribute('font-size', '9');
        subLabel.setAttribute('fill', 'rgba(148,163,184,0.7)');
        subLabel.textContent = edu.tagline;
        g.appendChild(subLabel);

        // Events
        g.addEventListener('mouseenter', (e) => showTooltip(e, edu));
        g.addEventListener('mousemove', (e) => moveTooltip(e));
        g.addEventListener('mouseleave', hideTooltip);
        g.addEventListener('click', () => openDetail(edu, g));

        svgEl.appendChild(g);
    });

    // Center node (9. klasse)
    const cg = svgCreate('g');

    // Pulse ring 1
    const pulse1 = svgCreate('circle');
    pulse1.setAttribute('cx', cx); pulse1.setAttribute('cy', cy);
    pulse1.setAttribute('r', '60');
    pulse1.setAttribute('fill', 'rgba(255,215,0,0.05)');
    pulse1.setAttribute('stroke', 'rgba(255,215,0,0.15)');
    pulse1.setAttribute('stroke-width', '1');
    animatePulse(pulse1, 60, 80, 3.5);
    cg.appendChild(pulse1);

    const pulse2 = svgCreate('circle');
    pulse2.setAttribute('cx', cx); pulse2.setAttribute('cy', cy);
    pulse2.setAttribute('r', '50');
    pulse2.setAttribute('fill', 'rgba(255,215,0,0.05)');
    pulse2.setAttribute('stroke', 'rgba(255,215,0,0.2)');
    pulse2.setAttribute('stroke-width', '1');
    animatePulse(pulse2, 50, 65, 3.5, 1);
    cg.appendChild(pulse2);

    // Center circle
    const centerBg = svgCreate('circle');
    centerBg.setAttribute('cx', cx); centerBg.setAttribute('cy', cy);
    centerBg.setAttribute('r', '44');
    centerBg.setAttribute('fill', 'rgba(255, 200, 0, 0.12)');
    centerBg.setAttribute('stroke', '#FFD700');
    centerBg.setAttribute('stroke-width', '2');
    centerBg.setAttribute('filter', 'url(#glow-center)');
    cg.appendChild(centerBg);

    const centerInner = svgCreate('circle');
    centerInner.setAttribute('cx', cx); centerInner.setAttribute('cy', cy);
    centerInner.setAttribute('r', '30');
    centerInner.setAttribute('fill', 'rgba(255, 200, 0, 0.2)');
    cg.appendChild(centerInner);

    // Center emoji
    const cfo = svgCreate('foreignObject');
    cfo.setAttribute('x', cx - 18); cfo.setAttribute('y', cy - 22);
    cfo.setAttribute('width', '36'); cfo.setAttribute('height', '36');
    cfo.style.pointerEvents = 'none';
    const cs = document.createElement('span');
    cs.textContent = '⭐';
    cs.style.cssText = 'font-size:26px;display:flex;align-items:center;justify-content:center;width:36px;height:36px;';
    cfo.appendChild(cs);
    cg.appendChild(cfo);

    // Center label
    const cLabel = svgCreate('text');
    cLabel.setAttribute('x', cx); cLabel.setAttribute('y', cy + 64);
    cLabel.setAttribute('text-anchor', 'middle');
    cLabel.setAttribute('font-family', "'Orbitron', monospace");
    cLabel.setAttribute('font-size', '13');
    cLabel.setAttribute('font-weight', '700');
    cLabel.setAttribute('fill', '#FFD700');
    cLabel.setAttribute('letter-spacing', '0.1em');
    cLabel.textContent = '9. KLASSE';
    cg.appendChild(cLabel);

    const cSub = svgCreate('text');
    cSub.setAttribute('x', cx); cSub.setAttribute('y', cy + 80);
    cSub.setAttribute('text-anchor', 'middle');
    cSub.setAttribute('font-family', "'Space Grotesk', sans-serif");
    cSub.setAttribute('font-size', '10');
    cSub.setAttribute('fill', 'rgba(255,215,0,0.5)');
    cSub.textContent = 'Du er her';
    cg.appendChild(cSub);

    svgEl.appendChild(cg);
}

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────
function svgCreate(tag) {
    return document.createElementNS('http://www.w3.org/2000/svg', tag);
}

function nodePos(edu) {
    const rad = (edu.angle - 90) * Math.PI / 180;
    return {
        nx: cx + edu.radius * Math.cos(rad),
        ny: cy + edu.radius * Math.sin(rad)
    };
}

function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `${r},${g},${b}`;
}

function animatePulse(el, r1, r2, duration, delay = 0) {
    let start = null;
    const d = delay * 1000;
    function step(ts) {
        if (!start) start = ts;
        const elapsed = (ts - start - d);
        if (elapsed < 0) { requestAnimationFrame(step); return; }
        const t = (elapsed % (duration * 1000)) / (duration * 1000);
        const eased = Math.sin(t * Math.PI);
        const r = r1 + (r2 - r1) * eased;
        const opacity = 0.2 - 0.15 * eased;
        el.setAttribute('r', r);
        el.setAttribute('fill-opacity', opacity);
        requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
}

// ─────────────────────────────────────────────
// TOOLTIP
// ─────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');
let tooltipVisible = false;

function showTooltip(e, edu) {
    document.getElementById('tt-emoji').textContent = edu.emoji;
    document.getElementById('tt-short').textContent = edu.shortName;
    document.getElementById('tt-short').style.color = edu.glow;
    document.getElementById('tt-full').textContent = edu.fullName;

    const badge = document.getElementById('tt-badge');
    badge.textContent = edu.tagline + ' · ' + edu.durationText.split('·')[1]?.trim();
    badge.style.background = edu.tagBg;
    badge.style.color = edu.tagColor;

    document.getElementById('tt-desc').textContent = edu.description.substring(0, 160) + '…';

    const leadsEl = document.getElementById('tt-leads');
    leadsEl.innerHTML = '<span>→ Åbner for: </span>' + edu.leads.slice(0,2).join(', ');

    // Highlight hover ring
    const g = e.currentTarget;
    const ring = g.querySelector('.hover-ring');
    if (ring) ring.setAttribute('opacity', '0.6');

    moveTooltip(e);
    tooltip.classList.add('visible');
    tooltipVisible = true;
}

function moveTooltip(e) {
    if (!tooltipVisible) return;
    const tw = 300, th = 200;
    let x = e.clientX + 20;
    let y = e.clientY - 20;
    if (x + tw > window.innerWidth - 10) x = e.clientX - tw - 20;
    if (y + th > window.innerHeight - 10) y = e.clientY - th;
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
}

function hideTooltip(e) {
    tooltip.classList.remove('visible');
    tooltipVisible = false;
    const g = e.currentTarget;
    const ring = g.querySelector('.hover-ring');
    if (ring) ring.setAttribute('opacity', '0');
}

// ─────────────────────────────────────────────
// DETAIL PANEL
// ─────────────────────────────────────────────
function openDetail(edu, nodeEl) {
    const panel = document.getElementById('detail-panel');

    document.getElementById('detail-emoji').textContent = edu.emoji;
    document.getElementById('detail-short').textContent = edu.shortName;
    document.getElementById('detail-short').style.color = edu.glow;
    document.getElementById('detail-full').textContent = edu.fullName;

    const badge = document.getElementById('detail-badge');
    badge.textContent = edu.durationText;
    badge.style.background = edu.tagBg;
    badge.style.color = edu.tagColor;

    document.getElementById('detail-dur-num').textContent = edu.duration;
    document.getElementById('detail-dur-num').style.color = edu.glow;
    document.getElementById('detail-dur-text').textContent = edu.durationText.split('·')[1]?.trim() || '';

    document.getElementById('detail-desc').textContent = edu.description;
    document.getElementById('detail-profile').textContent = edu.profile;

    const leadsEl = document.getElementById('detail-leads');
    leadsEl.innerHTML = edu.leads.map(l =>
        `<span class="detail-tag">${l}</span>`
    ).join('');

    const subjEl = document.getElementById('detail-subjects');
    subjEl.innerHTML = edu.subjects.map(s =>
        `<span class="detail-tag" style="border-color:${edu.color}30;color:${edu.glow}">${s}</span>`
    ).join('');

    // Update panel border color
    panel.style.borderLeftColor = `${edu.color}40`;

    panel.classList.add('open');
    activeNode = nodeEl;
}

function closeDetail() {
    document.getElementById('detail-panel').classList.remove('open');
    activeNode = null;
}

// Close panel on ESC
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeDetail();
});

// Click on SVG background closes panel
document.getElementById('main-svg').addEventListener('click', (e) => {
    if (!e.target.closest('.edu-node')) closeDetail();
});

// ─────────────────────────────────────────────
// RESIZE
// ─────────────────────────────────────────────
function handleResize() {
    const canvas = document.getElementById('star-bg');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    buildGraph();
}

let resizeTimeout;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(handleResize, 150);
});

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
initStars();
buildGraph();
</script>
